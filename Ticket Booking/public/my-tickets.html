<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - CINEVERSE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Custom Cinema Dark Style -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg cinema-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-film brand-icon"></i>
                <span>CINE<span class="text-danger">VERSE</span></span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movies.html"><i class="fa-solid fa-clapperboard me-1"></i>Movies</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/my-tickets.html"><i class="fa-solid fa-ticket me-1"></i>My Tickets</a></li>
                </ul>
                <div class="d-flex align-items-center" id="navbarAuthButtons"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4 flex-grow-1">
        
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1 text-muted small">
                        <li class="breadcrumb-item"><a href="/" class="text-muted">Home</a></li>
                        <li class="breadcrumb-item active text-danger" aria-current="page">My Bookings</li>
                    </ol>
                </nav>
                <h1 class="h2 fw-bold text-white mb-0">My Tickets & Bookings</h1>
            </div>
            <a href="/movies.html" class="btn btn-cinema-primary">
                <i class="fa-solid fa-plus me-1"></i>Book New Tickets
            </a>
        </div>

        <!-- Filter Tabs -->
        <ul class="nav nav-pills mb-4 gap-2" id="ticketTabs">
            <li class="nav-item">
                <button class="nav-link active btn-sm" data-tab="upcoming">
                    <i class="fa-solid fa-clock me-1"></i>Upcoming Movies (<span id="upcomingCount">0</span>)
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link btn-sm" data-tab="past">
                    <i class="fa-solid fa-history me-1"></i>Past & Cancelled (<span id="pastCount">0</span>)
                </button>
            </li>
        </ul>

        <!-- Tickets Container -->
        <div id="ticketsListContainer" class="row g-4">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border text-danger" role="status"></div>
                <div class="mt-2">Loading your cinema bookings...</div>
            </div>
        </div>

    </main>

    <!-- Digital Ticket QR Modal -->
    <div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-content-cinema shadow-lg border-0">
                <div class="modal-header border-secondary pb-0">
                    <h5 class="modal-title text-white"><i class="fa-solid fa-ticket text-danger me-2"></i>Digital Cinema Ticket</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="modalTicketBody">
                    <!-- Populated dynamically with ticket card -->
                </div>
                <div class="modal-footer border-secondary pt-2">
                    <button class="btn btn-cinema-primary btn-sm" onclick="window.print()">
                        <i class="fa-solid fa-print me-1"></i>Print Pass
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="cinema-footer">
        <div class="container text-center text-muted small">
            © 2026 CINEVERSE Online Cinema Booking System. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/my-tickets.js"></script>
</body>
</html>
