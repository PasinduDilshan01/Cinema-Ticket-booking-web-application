<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Register - CINEVERSE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom Cinema Dark Style -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center py-5" style="background: radial-gradient(circle at center, #141b2d 0%, #080a10 100%);">

    <div class="container" style="max-width: 480px;">
        
        <!-- Logo -->
        <div class="text-center mb-4">
            <a class="navbar-brand justify-content-center fs-2" href="/">
                <i class="fa-solid fa-film brand-icon"></i>
                <span>CINE<span class="text-danger">VERSE</span></span>
            </a>
            <p class="text-muted small mt-1">Your gateway to the ultimate cinematic experience</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-panel p-4 shadow-lg">
            
            <!-- Tab Switcher -->
            <ul class="nav nav-pills nav-fill mb-4 p-1 rounded" style="background: rgba(0,0,0,0.3);" id="authTabs">
                <li class="nav-item">
                    <button class="nav-link active fw-bold" id="loginTabBtn" data-target="#loginFormSection">Sign In</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link fw-bold" id="registerTabBtn" data-target="#registerFormSection">Create Account</button>
                </li>
            </ul>

            <!-- Sign In Form -->
            <div id="loginFormSection">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" id="loginEmail" class="form-control form-control-cinema border-start-0" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="loginPassword" class="form-control form-control-cinema border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-cinema-primary w-100 justify-content-center py-2 mb-3" id="loginSubmitBtn">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                    </button>
                </form>

                <!-- Quick Demo Login Helpers -->
                <div class="border-top border-secondary pt-3 mt-3">
                    <div class="text-muted small text-center mb-2">🚀 Instant Demo Logins:</div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-cinema-secondary w-50 justify-content-center" onclick="fillAndLogin('admin@cinema.com', 'admin123')">
                            <i class="fa-solid fa-shield-halved text-warning me-1"></i>Admin Demo
                        </button>
                        <button class="btn btn-sm btn-cinema-secondary w-50 justify-content-center" onclick="fillAndLogin('customer@cinema.com', 'customer123')">
                            <i class="fa-solid fa-user text-primary me-1"></i>Customer Demo
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sign Up Form -->
            <div id="registerFormSection" class="d-none">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Full Name *</label>
                        <input type="text" id="regName" class="form-control form-control-cinema" placeholder="Alex Morgan" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email Address *</label>
                        <input type="email" id="regEmail" class="form-control form-control-cinema" placeholder="alex@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Phone Number</label>
                        <input type="tel" id="regPhone" class="form-control form-control-cinema" placeholder="+1 (555) 000-0000">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Password * (min. 6 characters)</label>
                        <input type="password" id="regPassword" class="form-control form-control-cinema" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-cinema-primary w-100 justify-content-center py-2" id="regSubmitBtn">
                        <i class="fa-solid fa-user-plus me-2"></i>Create Account
                    </button>
                </form>
            </div>

        </div>

        <div class="text-center mt-3">
            <a href="/" class="text-muted small text-decoration-none hover-white"><i class="fa-solid fa-arrow-left me-1"></i>Back to Homepage</a>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
