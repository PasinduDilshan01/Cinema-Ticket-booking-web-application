<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Movies - CINEVERSE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom Cinema Dark Style -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg cinema-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-film brand-icon"></i>
                <span>CINE<span class="text-danger">VERSE</span></span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/movies.html"><i class="fa-solid fa-clapperboard me-1"></i>Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="/my-tickets.html"><i class="fa-solid fa-ticket me-1"></i>My Tickets</a></li>
                </ul>
                <div class="d-flex align-items-center" id="navbarAuthButtons"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4 flex-grow-1">
        
        <!-- Breadcrumb & Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1 text-muted small">
                        <li class="breadcrumb-item"><a href="/" class="text-muted">Home</a></li>
                        <li class="breadcrumb-item active text-danger" aria-current="page">Movies</li>
                    </ol>
                </nav>
                <h1 class="h2 fw-bold text-white mb-0">Movie Catalog</h1>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small">Sort by:</span>
                <select id="movieSortSelect" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: auto;">
                    <option value="rating">Top Rated ⭐</option>
                    <option value="release_date">Newest Releases</option>
                    <option value="title">Title (A - Z)</option>
                    <option value="duration">Runtime</option>
                </select>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- Left Sidebar Filter -->
            <div class="col-lg-3">
                <div class="glass-panel p-4 sticky-top" style="top: 90px;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-white mb-0"><i class="fa-solid fa-sliders text-danger me-2"></i>Filters</h5>
                        <button id="resetFiltersBtn" class="btn btn-link btn-sm text-muted text-decoration-none p-0">Reset</button>
                    </div>

                    <!-- Search -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold text-uppercase">Search</label>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" id="movieSearchInput" class="form-control bg-dark border-secondary text-white" placeholder="Movie title, cast...">
                        </div>
                    </div>

                    <!-- Status Filter -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold text-uppercase">Status</label>
                        <div class="d-flex flex-column gap-2">
                            <label class="form-check">
                                <input class="form-check-input" type="radio" name="statusFilter" value="all" checked>
                                <span class="form-check-label text-light">All Movies</span>
                            </label>
                            <label class="form-check">
                                <input class="form-check-input" type="radio" name="statusFilter" value="now_showing">
                                <span class="form-check-label text-light">Now Showing In Theaters</span>
                            </label>
                            <label class="form-check">
                                <input class="form-check-input" type="radio" name="statusFilter" value="coming_soon">
                                <span class="form-check-label text-light">Coming Soon</span>
                            </label>
                        </div>
                    </div>

                    <!-- Genre Filter -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold text-uppercase">Genre</label>
                        <div class="d-flex flex-wrap gap-2" id="genreFilterChips">
                            <button class="genre-chip active btn-sm" data-genre="all">All</button>
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Rating Slider -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between text-muted small mb-1">
                            <span class="fw-semibold text-uppercase">Minimum Rating</span>
                            <span id="ratingVal" class="text-warning fw-bold">Any</span>
                        </div>
                        <input type="range" class="form-range" id="ratingRange" min="0" max="10" step="0.5" value="0">
                    </div>

                </div>
            </div>

            <!-- Right Movies Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="text-muted small" id="movieCountLabel">Showing movies...</div>
                </div>

                <div class="row g-4" id="moviesCatalogGrid">
                    <div class="col-12 text-center py-5 text-muted">
                        <div class="spinner-border text-danger" role="status"></div>
                        <div class="mt-2">Loading movie catalog...</div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="cinema-footer">
        <div class="container text-center text-muted small">
            © 2026 CINEVERSE Online Cinema Booking System. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/movies.js"></script>
</body>
</html>
